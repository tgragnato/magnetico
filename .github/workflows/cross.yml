name: Test Cross Compilation without CGo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  generate-matrix:

    name: Generate Target Matrix
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: read
      pull-requests: read

    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}

    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27

      - name: Generate Target Matrix
        id: set-targets
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('node:child_process');
            const output = execSync('go tool dist list', { encoding: 'utf8' });
            const targets = output
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter((line) => /^(linux|freebsd|openbsd|darwin)\//.test(line))
              .map((target) => {
                const [goos, goarch] = target.split('/');
                return { target, goos, goarch };
              });
            core.setOutput('targets', JSON.stringify(targets));

  cross:

    name: Cross Compilation
    runs-on: ubuntu-latest
    needs: generate-matrix

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: read
      pull-requests: read

    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-matrix.outputs.targets) }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: 1.27

    - name: Build
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.target.goos }}
        GOARCH: ${{ matrix.target.goarch }}
      run: go build -v .
